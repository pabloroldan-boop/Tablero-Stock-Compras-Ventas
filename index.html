cdetails class=\"ex-notes\">\u003csummary>Criterios del análisis\u003c/summary>\u003cp class=\"muted\">Corte al %%HOY_DMY%%. Solo productos de tipo Mercadería; quedan fuera el código 6074 (Codificador), el 2873 (tubo 10 kg) y la venta de patio (canal NO). Análisis por producto unificado (pestaña Unificación de SKU): cada producto suma venta, compras y stock de todos sus códigos; los códigos que no figuran en esa pestaña se muestran con su código propio. ABC = Pareto sobre bultos vendidos en los 3 meses cerrados (%%R3%%). %%ACT_LC%% es mes en curso (parcial, al %%FIN%%).\u003c/p>\u003c/details>\n  \u003c/header>\n\n  \u003cnav class=\"sv-tabs\" role=\"tablist\">\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"resumen\" aria-selected=\"true\">Resumen ABC\u003c/button>\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"stock\" aria-selected=\"false\">Stock disponible\u003c/button>\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"abc\" aria-selected=\"false\">ABC vs compras y stock\u003c/button>\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"exceso\" aria-selected=\"false\">Compras vs venta\u003c/button>\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"inmov\" aria-selected=\"false\">Stock inmovilizado\u003c/button>\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"vencimientos\" aria-selected=\"false\">Vencimientos\u003c/button>\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"lenta\" aria-selected=\"false\">Venta lenta\u003c/button>\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"canales\" aria-selected=\"false\">Ventas por canal\u003c/button>\n    \u003cbutton class=\"sv-tab\" role=\"tab\" data-tab=\"planes\" aria-selected=\"false\">Planes de acción\u003c/button>\n  \u003c/nav>\n\n  \u003cdiv class=\"ctrls sv-prodbar\" id=\"filtro-producto\">\n    \u003clabel>Producto \u003cinput class=\"sv-prod\" list=\"sv-prod-list\" type=\"search\" placeholder=\"Producto, código unificado o SKU\" aria-label=\"Filtrar por producto\">\u003c/label>\n    \u003cdatalist id=\"sv-prod-list\" data-draw=\"prodlist\" data-source=\"sku\">\u003c/datalist>\n    \u003clabel>Unidad \u003cselect class=\"sv-p\" data-param=\"unidad\" aria-label=\"Unidad\">\u003coption value=\"b\">Bultos\u003c/option>\u003coption value=\"pal\">Pallets\u003c/option>\u003c/select>\u003c/label>\n    \u003clabel>Marca \u003cselect data-draw=\"attrsel\" data-a=\"marca\" data-source=\"sku\" aria-label=\"Filtrar por marca\">\u003c/select>\u003c/label>\n    \u003clabel>Calibre \u003cselect data-draw=\"attrsel\" data-a=\"calibre\" data-source=\"sku\" aria-label=\"Filtrar por calibre\">\u003c/select>\u003c/label>\n    \u003cbutton class=\"sv-prod-clear\" type=\"button\" hidden>Quitar filtros ×\u003c/button>\n    \u003cspan class=\"muted\">Producto, marca y calibre filtran gráficos, tablas y recuadros de todas las pestañas. La unidad cambia todas las cantidades entre bultos y pallets; el ABC siempre se calcula en bultos.\u003c/span>\n  \u003c/div>\n\n  \u003c!-- ============ RESUMEN ============ -->\n  \u003csection id=\"resumen\" class=\"sv-page\">\n    \u003cdiv class=\"tiles\">\n      \u003cdiv class=\"card tile\">\u003cspan class=\"muted\">Venta %%R3%% (\u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span>)\u003c/span>\u003cspan class=\"u-b big\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"venta_3m_b\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p big\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"venta_3m_b_p\" data-fmt=\"dec\" hidden>—\u003c/span>\u003cspan class=\"muted\">%%ACT_LC%% a la fecha: \u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"venta_oct_b\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"venta_oct_b_p\" data-fmt=\"dec\" hidden>—\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"card tile\">\u003cspan class=\"muted\">Venta %%R3%% (importe neto)\u003c/span>\u003cspan class=\"big\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"venta_3m_imp\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"skus_venta\" data-fmt=\"int\">—\u003c/span> SKUs con venta\u003c/span>\u003c/div>\n      \u003cdiv class=\"card tile\">\u003cspan class=\"muted\">Stock actual valorizado\u003c/span>\u003cspan class=\"big\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"stock_imp\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"stock_b\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"stock_b_p\" data-fmt=\"dec\" hidden>—\u003c/span> \u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"card tile\">\u003cspan class=\"muted\">Inmovilizado + lento\u003c/span>\u003cspan class=\"big bad\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"inmov_imp\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"inmov_b\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"inmov_b_p\" data-fmt=\"dec\" hidden>—\u003c/span> \u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"card tile\">\u003cspan class=\"muted\">Stock vencido\u003c/span>\u003cspan class=\"big bad\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"venc_imp\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"venc_b\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"venc_b_p\" data-fmt=\"dec\" hidden>—\u003c/span> \u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span> · vence en 60 días: \u003cspan data-draw=\"val\" data-source=\"kpi\" data-row=\"0\" data-field=\"v60_imp\" data-fmt=\"money\">—\u003c/span>\u003c/span>\u003c/div>\n      \u003cdiv class=\"card tile\">\u003cspan class=\"muted\">Compras por encima de la venta (%%R3%%)\u003c/span>\u003cspan class=\"big warn\" data-draw=\"val\" data-source=\"exc_res\" data-where=\"grupo=riesgo\" data-field=\"exceso_imp\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan data-draw=\"val\" data-source=\"exc_res\" data-where=\"grupo=riesgo\" data-field=\"skus\" data-fmt=\"int\">—\u003c/span> SKUs en sobrestock, lentos o inmovilizados\u003c/span>\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" id=\"pareto-card\">\n      \u003ch2>Curva de Pareto por SKU\u003c/h2>\n      \u003cp class=\"muted\">Bultos vendidos %%R3%% por SKU, de mayor a menor, y su participación acumulada. Corte A hasta 80 %, B hasta 95 %, C el resto.\u003c/p>\n      \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"sw\" data-draw=\"sw\" data-c=\"A\">\u003c/i>A\u003c/span>\u003cspan>\u003ci class=\"sw\" data-draw=\"sw\" data-c=\"B\">\u003c/i>B\u003c/span>\u003cspan>\u003ci class=\"sw\" data-draw=\"sw\" data-c=\"C\">\u003c/i>C\u003c/span>\u003cspan>— % acumulado\u003c/span>\u003c/div>\n      \u003cdiv class=\"chart\" data-draw=\"pareto\" data-source=\"sku\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" id=\"abc-res-card\">\n      \u003ch2>Resumen por clase ABC\u003c/h2>\n      \u003cp class=\"muted\">Cobertura = stock ÷ venta diaria promedio (días con stock desde el %%INI%%). \"Sin venta\" = SKUs sin venta %%R3%% (pueden tener venta en %%ACT_L%%).\u003c/p>\n      \u003cdiv class=\"tbox\">\n        \u003ctable class=\"sv-table\" data-source=\"abc_res\" data-row-key=\"abc\">\n          \u003cthead>\u003ctr>\u003cth data-field=\"abc\">Clase\u003c/th>\u003cth data-field=\"skus\" data-fmt=\"int\">SKUs\u003c/th>\u003cth class=\"u-b\" data-field=\"venta_b\" data-fmt=\"int\">Venta %%R3%% (bultos)\u003c/th>\u003cth class=\"u-p\" data-field=\"venta_b_p\" data-fmt=\"dec\" hidden>Venta %%R3%% (pallets)\u003c/th>\u003cth data-field=\"share\" data-fmt=\"pct\">% venta\u003c/th>\u003cth data-field=\"venta_imp\" data-fmt=\"money\">Venta %%R3%% ($)\u003c/th>\u003cth class=\"u-b\" data-field=\"comp_b\" data-fmt=\"int\">Compras %%R3%% (bultos)\u003c/th>\u003cth class=\"u-p\" data-field=\"comp_b_p\" data-fmt=\"dec\" hidden>Compras %%R3%% (pallets)\u003c/th>\u003cth class=\"u-b\" data-field=\"stock_b\" data-fmt=\"int\">Stock (bultos)\u003c/th>\u003cth class=\"u-p\" data-field=\"stock_b_p\" data-fmt=\"dec\" hidden>Stock (pallets)\u003c/th>\u003cth data-field=\"stock_imp\" data-fmt=\"money\">Stock ($)\u003c/th>\u003cth data-field=\"cob_dias\" data-fmt=\"int\">Cobertura (días)\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody data-draw=\"table\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\">\n      \u003ch3>Cómo se calcula\u003c/h3>\n      \u003cdl class=\"defs\">\n        \u003cdt>Producto unificado\u003c/dt>\u003cdd>Código de la pestaña Unificación de SKU (ej. Q1 = Quilmes clásica litro: 46629, 7026 y 31748). Los códigos que no están en esa pestaña quedan como producto propio y se marcan como \"No\" en la columna Unificado.\u003c/dd>\n        \u003cdt>Pallets\u003c/dt>\u003cdd>Cada cantidad se convierte con los bultos por pallet de su código original (pestaña Bultos por pallet) y luego se suma por producto unificado, porque códigos de un mismo producto pueden paletizar distinto (ej. Mirinda 500 x12 = 168 y x6 = 336 bultos por pallet).\u003c/dd>\n        \u003cdt>ABC\u003c/dt>\u003cdd>Venta en bultos de %%M3_LIST%% (meses cerrados), solo mercadería. Se ordena de mayor a menor; los SKUs que acumulan el primer 80 % son A, hasta 95 % B, el resto C.\u003c/dd>\n        \u003cdt>Compras\u003c/dt>\u003cdd>Se toman las compras del mismo período que la venta: %%R3%% (meses cerrados) y %%ACT_L%% aparte. La hoja Compras no trae código: cada descripción del proveedor se asoció a su código de la BD SKU (209 descripciones). Las compras de envases (botellas) quedan fuera.\u003c/dd>\n        \u003cdt>Alcance\u003c/dt>\u003cdd>Se toma solo lo que la columna Tipo de producto marca como Mercadería (envases, esqueletos y P.O.P. quedan fuera) en stock, ventas y compras. Se excluyen además el código 6074 (Codificador), el 2873 (tubo 10 kg) y la venta de patio (canal NO).\u003c/dd>\n        \u003cdt>Stock\u003c/dt>\u003cdd>Neto por SKU sumando todas las líneas de almacén (bultos + unidades sueltas convertidas a bultos). Los productos con menos de 1 bulto en total (solo unidades sueltas) se consideran sin stock. Valor = subtotal del archivo; las líneas con precio 0 se valorizaron al último precio de compra.\u003c/dd>\n        \u003cdt>Vencido\u003c/dt>\u003cdd>Las líneas negativas sin lote se descuentan primero de los lotes que vencen antes (FEFO); lo que queda con vencimiento anterior al %%HOY_DM%% es vencido.\u003c/dd>\n        \u003cdt>Última compra\u003c/dt>\u003cdd>Fecha de la última factura del producto en la pestaña Compras (todo 2026) y los bultos (o pallets) comprados ese día, sumando los SKUs del producto unificado comprados esa fecha. \"—\" = sin compras en 2026.\u003c/dd>\n        \u003cdt>Compras vs venta\u003c/dt>\u003cdd>Exceso = compras %%R3%% − venta %%R3%% del producto unificado, cuando es positivo, valorizado al costo del stock (o al último precio de compra si no hay stock). Compra innecesaria = exceso en productos que hoy están en sobrestock, lentos o inmovilizados.\u003c/dd>\n        \u003cdt>Estado del stock\u003c/dt>\u003cdd>Se calcula sobre el producto unificado (stock y venta de todos sus códigos). Inmovilizado: sin ninguna venta %%R4%%. Lento: sin venta %%R2A%% o cobertura mayor a 180 días. Sobrestock: cobertura entre 90 y 180 días. Sano: hasta 90 días.\u003c/dd>\n      \u003c/dl>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ STOCK DISPONIBLE ============ -->\n  \u003csection id=\"stock\" class=\"sv-page\" hidden>\n    \u003cp class=\"muted\">Stock actual al %%HOY_DM%% de los productos con al menos 1 bulto, por clase ABC y por unidad de negocio. Productos = productos unificados con stock. Pallets según los bultos por pallet de cada código. \"%%SV_LBL%%\" = productos con stock que no registraron ninguna venta desde el %%REC%% (%%M3_L%% y %%ACT_L%% a la fecha); \"Venta lenta\" = productos que sí vendieron desde el %%REC%% pero cuyo stock cubre más de 180 días de venta; se muestran los días de cobertura. Un producto figura en una sola de las dos situaciones. \"Venta %%ACT_L%%\" = bultos (o pallets) e importe neto vendidos del %%ACT1%% a la fecha por todos los productos del grupo, tengan o no stock hoy. El detalle de cada producto está en la lista de abajo. \"Ingreso reciente\" = producto sin venta desde el %%REC%% que tuvo menos de 15 días de stock en ese período (por ejemplo, entró el %%FIN%%). \"Sin disponibilidad\" = marcado a mano desde la pestaña Venta lenta.\u003c/p>\n    \u003cdiv class=\"card sd-total\" id=\"sd-total-card\">\n      \u003cdiv class=\"sd-grid\">\n        \u003cdiv>\u003cspan class=\"muted\">Productos con stock\u003c/span>\u003cspan class=\"big\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"skus\" data-fmt=\"int\">—\u003c/span>\u003c/div>\n        \u003cdiv>\u003cspan class=\"muted\">Bultos\u003c/span>\u003cspan class=\"big\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"bultos\" data-fmt=\"int\">—\u003c/span>\u003c/div>\n        \u003cdiv>\u003cspan class=\"muted\">Pallets\u003c/span>\u003cspan class=\"big\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"pallets\" data-fmt=\"dec\">—\u003c/span>\u003c/div>\n        \u003cdiv>\u003cspan class=\"muted\">Valorizado\u003c/span>\u003cspan class=\"big\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"valor\" data-fmt=\"money\">—\u003c/span>\u003c/div>\n        \u003cdiv>\u003cspan class=\"muted\">Venta %%ACT_L%% (a la fecha)\u003c/span>\u003cspan class=\"big\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"vo_imp\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"vo_b\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"vo_p\" data-fmt=\"dec\" hidden>—\u003c/span> \u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span>\u003c/span>\u003c/div>\n        \u003cdiv>\u003cspan class=\"muted\">%%SV_LBL%%\u003c/span>\u003cspan class=\"big bad\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"sv_valor\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"sv_skus\" data-fmt=\"int\">—\u003c/span> productos\u003c/span>\u003c/div>\n        \u003cdiv>\u003cspan class=\"muted\">Venta lenta (&gt;180 días)\u003c/span>\u003cspan class=\"big warn\" data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"le_valor\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan data-draw=\"val\" data-source=\"stock_disp\" data-where=\"tipo=total\" data-field=\"le_skus\" data-fmt=\"int\">—\u003c/span> productos\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003ch2 id=\"sd-abc\">Por clase ABC\u003c/h2>\n    \u003cdiv class=\"sd-cards\" data-draw=\"sdCards\" data-tipo=\"abc\" data-source=\"stock_disp\">\u003c/div>\n    \u003ch2 id=\"sd-un\">Por unidad de negocio\u003c/h2>\n    \u003cdiv class=\"sd-cards\" data-draw=\"sdCards\" data-tipo=\"un\" data-source=\"stock_disp\">\u003c/div>\n\n    \u003cdiv class=\"card\" id=\"sd-list-card\">\n      \u003ch2>Productos con stock\u003c/h2>\n      \u003cp class=\"muted\">Cada producto tiene una fila resumen (SKU, situación, clase, stock y valor total, venta, cobertura y última compra) y debajo una línea por cada lote de vencimiento. Muestra todos los productos con stock según los filtros aplicados (producto, marca y calibre de arriba; clase, unidad de negocio, división y situación acá). Situación: sin venta desde el %%REC%%, venta lenta (más de 180 días de cobertura) o venta normal. La cantidad sigue el selector de unidad.\u003c/p>\n      \u003cdiv class=\"ctrls\">\n        \u003clabel>Situación \u003cselect class=\"sv-p\" data-param=\"sd_sit\" aria-label=\"Situación\">\u003coption value=\"Todas\">Todas\u003c/option>\u003coption>%%SV_LBL%%\u003c/option>\u003coption>Venta lenta\u003c/option>\u003coption>Venta normal\u003c/option>\u003coption>Ingreso reciente\u003c/option>\u003coption>Sin disponibilidad\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Clase \u003cselect class=\"sv-p\" data-param=\"sd_abc\" aria-label=\"Clase ABC\">\u003coption value=\"Todos\">Todas\u003c/option>\u003coption value=\"A\">A\u003c/option>\u003coption value=\"B\">B\u003c/option>\u003coption value=\"C\">C\u003c/option>\u003coption value=\"Sin venta\">Sin venta %%R3%%\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Producto \u003cinput class=\"sv-sdq\" type=\"search\" placeholder=\"Producto o código\" aria-label=\"Filtrar producto en la lista\">\u003c/label>\n        \u003clabel>Unidad de negocio \u003cselect data-draw=\"sdSel\" data-campo=\"unidad_negocio\" data-param=\"sd_un\" aria-label=\"Unidad de negocio\" data-source=\"sku\">\u003c/select>\u003c/label>\n        \u003clabel>División \u003cselect data-draw=\"sdSel\" data-campo=\"division\" data-param=\"sd_div\" aria-label=\"División\" data-source=\"sku\">\u003c/select>\u003c/label>\n      \u003c/div>\n      \u003cp class=\"muted\">\u003cb data-draw=\"sdCount\" data-source=\"sku\">—\u003c/b>\u003c/p>\n      \u003cdiv class=\"ctrls sv-gctl\">\u003cbutton type=\"button\" class=\"pl-btn sv-gall\" data-act=\"open\">⊞ Desagrupar todo (ver lotes)\u003c/button>\u003cbutton type=\"button\" class=\"pl-btn sv-gall\" data-act=\"closed\">⊟ Agrupar todo (solo resumen)\u003c/button>\u003cspan class=\"muted\">Tocá el ▸ / ▾ de un producto para abrir o cerrar sus lotes.\u003c/span>\u003c/div>\n      \u003cdiv class=\"tbox\">\n        \u003ctable class=\"sv-table\" data-source=\"sku_lotes\" data-row-key=\"lote\">\n          \u003cthead>\u003ctr>\u003cth data-field=\"producto\">Producto\u003c/th>\u003cth data-field=\"sku_origen\" class=\"l\">SKU\u003c/th>\u003cth data-field=\"situacion\" class=\"l\">Situación\u003c/th>\u003cth data-field=\"abc\" class=\"l\">Clase\u003c/th>\u003cth data-field=\"vto\" class=\"l\" data-fmt=\"date\">Vencimiento\u003c/th>\u003cth data-field=\"dias\" data-fmt=\"int\">Días\u003c/th>\u003cth class=\"u-b\" data-field=\"lote_b\" data-fmt=\"int\">Lote (bultos)\u003c/th>\u003cth class=\"u-p\" data-field=\"lote_b_p\" data-fmt=\"dec\" hidden>Lote (pallets)\u003c/th>\u003cth data-field=\"lote_valor\" data-fmt=\"money\">Valor del lote\u003c/th>\u003cth class=\"u-b\" data-field=\"stock_b\" data-fmt=\"int\">Stock total (bultos)\u003c/th>\u003cth class=\"u-p\" data-field=\"stock_b_p\" data-fmt=\"dec\" hidden>Stock total (pallets)\u003c/th>\u003cth data-field=\"stock_imp\" data-fmt=\"money\">Valor total\u003c/th>\u003cth class=\"u-b\" data-field=\"v_oct\" data-fmt=\"int\">Venta %%ACT_S%% (bultos)\u003c/th>\u003cth class=\"u-p\" data-field=\"v_oct_p\" data-fmt=\"dec\" hidden>Venta %%ACT_S%% (pallets)\u003c/th>\u003cth data-field=\"cob_dias\" data-fmt=\"int\">Cobertura (días)\u003c/th>\u003cth data-field=\"ult_compra\" class=\"l\" data-fmt=\"date\">Fecha últ. compra\u003c/th>\u003cth class=\"u-b\" data-field=\"ult_compra_b\" data-fmt=\"int\">Bultos últ. compra\u003c/th>\u003cth class=\"u-p\" data-field=\"ult_compra_b_p\" data-fmt=\"dec\" hidden>Pallets últ. compra\u003c/th>\u003cth data-field=\"ult_compra_dias\" data-fmt=\"int\">Días desde últ. compra\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody data-draw=\"table\" data-filter=\"sd\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ ABC vs COMPRAS Y STOCK ============ -->\n  \u003csection id=\"abc\" class=\"sv-page\" hidden>\n    \u003cdiv class=\"card\" id=\"cvv-card\">\n      \u003ch2>Compras vs. ventas por mes\u003c/h2>\n      \u003cp class=\"muted\">Comprado y vendido por mes, %%M1_L%% a %%ACT_L%%, según la clase ABC elegida, y la diferencia: en verde el stock que se generó (se compró más de lo que se vendió) y en rojo el stock que se utilizó (se vendió más de lo que se compró). %%ACT_LC%% parcial.\u003c/p>\n      \u003cdiv class=\"ctrls\">\u003clabel>Clase \u003cselect class=\"sv-p\" data-param=\"abc\" aria-label=\"Clase ABC\">\u003coption value=\"Todos\">Todas\u003c/option>\u003coption value=\"A\">A\u003c/option>\u003coption value=\"B\">B\u003c/option>\u003coption value=\"C\">C\u003c/option>\u003coption value=\"Sin venta\">Sin venta\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n      \u003cdiv class=\"legend\">\u003cspan>\u003ci class=\"sw\" data-draw=\"sw\" data-c=\"compra\">\u003c/i>Compras\u003c/span>\u003cspan>\u003ci class=\"sw\" data-draw=\"sw\" data-c=\"venta\">\u003c/i>Ventas\u003c/span>\u003cspan>\u003ci class=\"sw\" data-draw=\"sw\" data-c=\"gen\">\u003c/i>Stock generado (compras &gt; ventas)\u003c/span>\u003cspan>\u003ci class=\"sw\" data-draw=\"sw\" data-c=\"uso\">\u003c/i>Stock utilizado (ventas &gt; compras)\u003c/span>\u003c/div>\n      \u003cdiv class=\"grid\">\n        \u003cdiv>\u003ch3 id=\"cvv-b\">\u003cspan class=\"u-b\">En bultos\u003c/span>\u003cspan class=\"u-p\" hidden>En pallets\u003c/span>\u003c/h3>\u003cdiv class=\"chart\" style=\"min-height:320px\" data-draw=\"cvv\" data-m=\"b\" data-source=\"cvv compras_mes sku canal\">\u003c/div>\u003c/div>\n        \u003cdiv>\u003ch3 id=\"cvv-imp\">En pesos\u003c/h3>\u003cdiv class=\"chart\" style=\"min-height:320px\" data-draw=\"cvv\" data-m=\"imp\" data-source=\"cvv compras_mes sku canal\">\u003c/div>\u003c/div>\n      \u003c/div>\n      \u003cp class=\"muted\">En pesos, las compras son el importe de las facturas y las ventas se valorizan al costo del mes: bultos vendidos × precio promedio de compra del producto en ese mes (si no hubo compra ese mes, el último precio de compra anterior). Así la diferencia es stock generado o utilizado a valor de costo. La venta a importe neto se ve al pasar el mouse.\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" id=\"sku-card\">\n      \u003ch2>Detalle por SKU\u003c/h2>\n      \u003cp class=\"muted\">Cada producto con su clase, venta, compras y stock. Ordená tocando una columna.\u003c/p>\n      \u003cdiv class=\"ctrls\">\n        \u003clabel>Clase \u003cselect class=\"sv-p\" data-param=\"abc\" aria-label=\"Clase ABC\">\u003coption value=\"Todos\">Todas\u003c/option>\u003coption value=\"A\">A\u003c/option>\u003coption value=\"B\">B\u003c/option>\u003coption value=\"C\">C\u003c/option>\u003coption value=\"Sin venta\">Sin venta\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Unificado \u003cselect class=\"sv-p\" data-param=\"unif\" aria-label=\"Unificado\">\u003coption value=\"Todos\">Todos\u003c/option>\u003coption value=\"si\">Sí\u003c/option>\u003coption value=\"no\">No (código propio)\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Estado \u003cselect class=\"sv-p\" data-param=\"estado\" aria-label=\"Estado de stock\">\u003coption value=\"Todos\">Todos\u003c/option>\u003coption>Sano\u003c/option>\u003coption>Sobrestock (90-180 d)\u003c/option>\u003coption>Lento (&gt;180 d)\u003c/option>\u003coption>Inmovilizado\u003c/option>\u003coption>Sin stock\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>División \u003cselect data-draw=\"divsel\" aria-label=\"División\" data-source=\"sku\">\u003c/select>\u003c/label>\n        \u003clabel>Buscar \u003cinput class=\"sv-q\" type=\"search\" placeholder=\"Producto, marca o código\" aria-label=\"Buscar producto\">\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"tbox\">\n        \u003ctable class=\"sv-table\" data-source=\"sku\" data-row-key=\"k\">\n          \u003cthead>\u003ctr>\u003cth data-field=\"producto\">Producto\u003c/th>\u003cth data-field=\"k\" class=\"l\">Código\u003c/th>\u003cth data-field=\"skus\" class=\"l\">SKUs incluidos\u003c/th>\u003cth data-field=\"bxp\" class=\"l\">Bultos por pallet\u003c/th>\u003cth data-field=\"division\" class=\"l\">División\u003c/th>\u003cth data-field=\"abc\" class=\"l\">Clase\u003c/th>\u003cth class=\"u-b\" data-field=\"v_3m\" data-fmt=\"int\">Venta %%R3%%\u003c/th>\u003cth class=\"u-p\" data-field=\"v_3m_p\" data-fmt=\"dec\" hidden>Venta %%R3%% (pallets)\u003c/th>\u003cth class=\"u-b\" data-field=\"v_oct\" data-fmt=\"int\">Venta %%ACT_S%%\u003c/th>\u003cth class=\"u-p\" data-field=\"v_oct_p\" data-fmt=\"dec\" hidden>Venta %%ACT_S%% (pallets)\u003c/th>\u003cth class=\"u-b\" data-field=\"comp_b\" data-fmt=\"int\">Compras %%R3%%\u003c/th>\u003cth class=\"u-p\" data-field=\"comp_b_p\" data-fmt=\"dec\" hidden>Compras %%R3%% (pallets)\u003c/th>\u003cth class=\"u-b\" data-field=\"comp_b_oct\" data-fmt=\"int\">Compras %%ACT_S%%\u003c/th>\u003cth class=\"u-p\" data-field=\"comp_b_oct_p\" data-fmt=\"dec\" hidden>Compras %%ACT_S%% (pallets)\u003c/th>\u003cth data-field=\"ult_compra\" class=\"l\" data-fmt=\"date\">Fecha últ. compra\u003c/th>\u003cth class=\"u-b\" data-field=\"ult_compra_b\" data-fmt=\"int\">Bultos últ. compra\u003c/th  value=\"imp\">$ (valorizado)\u003c/option>\u003coption value=\"b\">Cantidad\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n      \u003cdiv class=\"chart\" data-draw=\"vencMes\" data-source=\"venc_mes lotes\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" id=\"lotes-card\">\n      \u003ch2>Listado de SKU por lote\u003c/h2>\n      \u003cp class=\"muted\">Un renglón por SKU y lote, ordenado por fecha de vencimiento (primero lo vencido). En cada lote podés crear un plan de acción por vencimiento: se abre el formulario de la pestaña Planes de acción con el producto y el lote cargados.\u003c/p>\n      \u003cdiv class=\"ctrls\">\n        \u003clabel>Vencimiento \u003cselect class=\"sv-p\" data-param=\"rango\" aria-label=\"Rango de vencimiento\">\u003coption value=\"Todos\">Todos\u003c/option>\u003coption>Vencido\u003c/option>\u003coption>0-30 d\u003c/option>\u003coption>31-60 d\u003c/option>\u003coption>61-90 d\u003c/option>\u003coption>91-180 d\u003c/option>\u003coption>&gt; 180 d\u003c/option>\u003coption>Sin fecha\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Plan \u003cselect class=\"sv-p\" data-param=\"lv_plan\" aria-label=\"Plan de acción\">\u003coption value=\"todos\">Todos\u003c/option>\u003coption value=\"sin\">Sin plan\u003c/option>\u003coption value=\"con\">Con plan\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>División \u003cselect data-draw=\"divsel\" aria-label=\"División\" data-source=\"sku\">\u003c/select>\u003c/label>\n        \u003clabel>Buscar \u003cinput class=\"sv-q\" type=\"search\" placeholder=\"Producto, marca o código\" aria-label=\"Buscar producto\">\u003c/label>\n      \u003c/div>\n      \u003cp class=\"muted\">\u003cb data-draw=\"lvCount\" data-source=\"lotes\">—\u003c/b>\u003c/p>\n      \u003cdiv class=\"tbox\">\n        \u003ctable class=\"sv-table pl-table sv-freeze\">\n          \u003cthead>\u003ctr>\u003cth class=\"l\">SKU\u003c/th>\u003cth class=\"l\">Producto\u003c/th>\u003cth class=\"l\">Clase\u003c/th>\u003cth class=\"l\">Vencimiento\u003c/th>\u003cth>Días\u003c/th>\u003cth>\u003cspan class=\"u-b\">Bultos\u003c/span>\u003cspan class=\"u-p\" hidden>Pallets\u003c/span>\u003c/th>\u003cth>Valor\u003c/th>\u003cth>Bultos por pallet\u003c/th>\u003cth class=\"l\">Fecha últ. compra\u003c/th>\u003cth>\u003cspan class=\"u-b\">Bultos últ. compra\u003c/span>\u003cspan class=\"u-p\" hidden>Pallets últ. compra\u003c/span>\u003c/th>\u003cth class=\"l\">Plan\u003c/th>\u003cth class=\"l\">Acción del plan\u003c/th>\u003cth class=\"l\">\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody data-draw=\"lotesVto\" data-source=\"lotes\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ VENTA LENTA ============ -->\n  \u003csection id=\"lenta\" class=\"sv-page\" hidden>\n    \u003cp class=\"lead\">Hay \u003cb class=\"bad\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Total\" data-field=\"valor\" data-fmt=\"money\">—\u003c/b> en \u003cb data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Total\" data-field=\"productos\" data-fmt=\"int\">—\u003c/b> productos con venta lenta o sin venta (\u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Total\" data-field=\"bultos\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Total\" data-field=\"bultos_p\" data-fmt=\"dec\" hidden>—\u003c/span> \u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span>).\u003c/p>\n    \u003cp class=\"muted\">Productos con stock según su velocidad de venta, sin mirar fechas de vencimiento (eso está en la pestaña Vencimientos). Cobertura = stock ÷ venta diaria promedio de los días con stock desde el %%INI%%. Tocá un recuadro para filtrar el listado. Cobertura y venta diaria se calculan sobre los días en que el producto tuvo stock (reconstruidos con los remitos de ingreso). Si en el período tuvo menos de 15 días de stock, figura como \"Ingreso reciente\" y no como sin venta. Con el botón \"Sin disponibilidad\" podés sacar a mano un producto que figura con stock pero no se pudo vender.\u003c/p>\n    \u003cdiv class=\"tiles\">\u003cdiv class=\"card tile click\" data-vlcat=\"%%SV_LBL%%\">\u003cspan class=\"muted\">%%SV_LBL%%\u003c/span>\u003cspan class=\"big bad\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=%%SV_LBL%%\" data-field=\"valor\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=%%SV_LBL%%\" data-field=\"productos\" data-fmt=\"int\">—\u003c/span> productos · \u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=%%SV_LBL%%\" data-field=\"bultos\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=%%SV_LBL%%\" data-field=\"bultos_p\" data-fmt=\"dec\" hidden>—\u003c/span> \u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"card tile click\" data-vlcat=\"Venta lenta (&gt; 180 días)\">\u003cspan class=\"muted\">Venta lenta (más de 180 días de cobertura)\u003c/span>\u003cspan class=\"big bad\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Venta lenta (&gt; 180 días)\" data-field=\"valor\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Venta lenta (&gt; 180 días)\" data-field=\"productos\" data-fmt=\"int\">—\u003c/span> productos · \u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Venta lenta (&gt; 180 días)\" data-field=\"bultos\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Venta lenta (&gt; 180 días)\" data-field=\"bultos_p\" data-fmt=\"dec\" hidden>—\u003c/span> \u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span>\u003c/span>\u003c/div>\u003cdiv class=\"card tile click\" data-vlcat=\"Sobrestock (90 a 180 días)\">\u003cspan class=\"muted\">Sobrestock (90 a 180 días de cobertura)\u003c/span>\u003cspan class=\"big warn\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Sobrestock (90 a 180 días)\" data-field=\"valor\" data-fmt=\"money\">—\u003c/span>\u003cspan class=\"muted\">\u003cspan data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Sobrestock (90 a 180 días)\" data-field=\"productos\" data-fmt=\"int\">—\u003c/span> productos · \u003cspan class=\"u-b\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Sobrestock (90 a 180 días)\" data-field=\"bultos\" data-fmt=\"int\">—\u003c/span>\u003cspan class=\"u-p\" data-draw=\"val\" data-source=\"vl_res\" data-where=\"cat=Sobrestock (90 a 180 días)\" data-field=\"bultos_p\" data-fmt=\"dec\" hidden>—\u003c/span> \u003cspan class=\"u-b\">bultos\u003c/span>\u003cspan class=\"u-p\" hidden>pallets\u003c/span>\u003c/span>\u003c/div>\u003c/div>\n\n    \u003cdiv class=\"card\" id=\"vl-card\">\n      \u003ch2>Listado de productos de venta lenta\u003c/h2>\n      \u003cp class=\"muted\">Un renglón por producto, ordenado por valor del stock. En cada producto podés crear un plan de acción por venta lenta: se abre el formulario de la pestaña Planes de acción con el producto y el motivo cargados.\u003c/p>\n      \u003cdiv class=\"ctrls\">\n        \u003clabel>Motivo \u003cselect class=\"sv-p\" data-param=\"vl_cat\" aria-label=\"Motivo\">\u003coption value=\"Todos\">Todos\u003c/option>\u003coption>%%SV_LBL%%\u003c/option>\u003coption>Venta lenta (&gt; 180 días)\u003c/option>\u003coption>Sobrestock (90 a 180 días)\u003c/option>\u003coption value=\"Sin disponibilidad\">Marcados sin disponibilidad\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Plan \u003cselect class=\"sv-p\" data-param=\"vl_plan\" aria-label=\"Plan de acción\">\u003coption value=\"todos\">Todos\u003c/option>\u003coption value=\"sin\">Sin plan\u003c/option>\u003coption value=\"con\">Con plan\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>División \u003cselect data-draw=\"divsel\" aria-label=\"División\" data-source=\"sku\">\u003c/select>\u003c/label>\n        \u003clabel>Buscar \u003cinput class=\"sv-q\" type=\"search\" placeholder=\"Producto, marca o código\" aria-label=\"Buscar producto\">\u003c/label>\n      \u003c/div>\n      \u003cp class=\"muted\">\u003cb data-draw=\"vlCount\" data-source=\"sku\">—\u003c/b>\u003c/p>\n      \u003cdiv class=\"tbox\">\n        \u003ctable class=\"sv-table pl-table sv-freeze\">\n          \u003cthead>\u003ctr>\u003cth class=\"l\">SKU\u003c/th>\u003cth class=\"l\">Producto\u003c/th>\u003cth class=\"l\">Clase\u003c/th>\u003cth class=\"l\">Motivo\u003c/th>\u003cth>\u003cspan class=\"u-b\">Stock (bultos)\u003c/span>\u003cspan class=\"u-p\" hidden>Stock (pallets)\u003c/span>\u003c/th>\u003cth>Valor\u003c/th>\u003cth>\u003cspan class=\"u-b\">Venta %%R3%%\u003c/span>\u003cspan class=\"u-p\" hidden>Venta %%R3%% (pallets)\u003c/span>\u003c/th>\u003cth>\u003cspan class=\"u-b\">Venta %%ACT_S%%\u003c/span>\u003cspan class=\"u-p\" hidden>Venta %%ACT_S%% (pallets)\u003c/span>\u003c/th>\u003cth>Cobertura (días)\u003c/th>\u003cth class=\"l\">Fecha últ. compra\u003c/th>\u003cth>\u003cspan class=\"u-b\">Bultos últ. compra\u003c/span>\u003cspan class=\"u-p\" hidden>Pallets últ. compra\u003c/span>\u003c/th>\u003cth class=\"l\">Plan\u003c/th>\u003cth class=\"l\">Acción del plan\u003c/th>\u003cth class=\"l\">\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody data-draw=\"vlList\" data-source=\"sku\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ CANALES ============ -->\n  \u003csection id=\"canales\" class=\"sv-page\" hidden>\n    \u003cdiv class=\"card\" id=\"canal-mes-card\">\n      \u003ch2>Venta mensual por canal\u003c/h2>\n      \u003cp class=\"muted\">Venta por mes de %%M1_L%% a %%ACT_L%% (%%ACT_L%% en curso, al %%FIN%%), apilada por canal; el número sobre cada barra es el total del mes. Pasá el mouse para ver cada canal y su participación.\u003c/p>\n      \u003cdiv class=\"ctrls\">\u003clabel>Medida \u003cselect class=\"sv-p\" data-param=\"metric\" aria-label=\"Medida\">\u003coption value=\"imp\">$ (importe neto)\u003c/option>\u003coption value=\"b\">Cantidad\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n      \u003cdiv class=\"legend\" data-draw=\"canalLegend\" data-source=\"canal_mes canal\">—\u003c/div>\n      \u003cdiv class=\"chart\" data-draw=\"canalLines\" data-source=\"canal_mes canal\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" id=\"heat-card\">\n      \u003ch2>Venta por categoría y canal\u003c/h2>\n      \u003cp class=\"muted\">Cada celda muestra la venta del grupo en el canal. La intensidad del color sigue la vista elegida.\u003c/p>\n      \u003cdiv class=\"ctrls\">\n        \u003clabel>Apertura \u003cselect class=\"sv-p\" data-param=\"dim\" aria-label=\"Apertura\">\u003coption value=\"division\">División\u003c/option>\u003coption value=\"unidad_negocio\">Unidad de negocio\u003c/option>\u003coption value=\"calibre\">Calibre\u003c/option>\u003coption value=\"marca\">Marca\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Período \u003cselect class=\"sv-p\" data-param=\"periodo\" aria-label=\"Período\">\u003coption value=\"3m\">%%R3C%% (cerrados)\u003c/option>\u003coption value=\"oct\">%%ACT_LC%% (en curso)\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Medida \u003cselect class=\"sv-p\" data-param=\"metric\" aria-label=\"Medida\">\u003coption value=\"imp\">$ (importe neto)\u003c/option>\u003coption value=\"b\">Cantidad\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Vista \u003cselect class=\"sv-p\" data-param=\"vista\" aria-label=\"Vista\">\u003coption value=\"mix_canal\">% del canal (mix)\u003c/option>\u003coption value=\"mix_grupo\">% del grupo por canal\u003c/option>\u003coption value=\"valor\">Valor\u003c/option>\u003c/select>\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"heat\" data-draw=\"heat\" data-source=\"canal_dim canal\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ============ PLANES DE ACCIÓN ============ -->\n  \u003csection id=\"planes\" class=\"sv-page\" hidden>\n    \u003cp class=\"muted\">Consolidado y listado de los planes de acción por vencimiento y por venta lenta. Los planes se crean desde las pestañas Vencimientos y Venta lenta (botón \"Crear plan\"). Queda guardado en la pestaña \"Planes\" de la planilla, para todos los que tienen acceso.\u003c/p>\n    \u003cp class=\"pl-m muted\" data-m=\"connecting\" hidden>Conectando con el registro de planes…\u003c/p>\n    \u003cp class=\"pl-m bad\" data-m=\"unavailable\" hidden>El registro de planes no está disponible en esta vista (hace falta haber iniciado sesión y tener acceso al tablero).\u003c/p>\n    \u003cp class=\"pl-m bad\" data-m=\"readerr\" hidden>No se pudieron leer los planes. Volvé a abrir el tablero.\u003c/p>\n    \u003cp class=\"pl-m bad\" data-m=\"perm\" hidden>No tenés permiso para editar los planes (hace falta acceso de edición al tablero).\u003c/p>\n    \u003cp class=\"pl-m bad\" data-m=\"saveerr\" hidden>No se pudo guardar el cambio. Probá de nuevo.\u003c/p>\n\n    \u003cdiv class=\"card\" id=\"pl-res-card\">\n      \u003ch2>Consolidado de planes\u003c/h2>\n      \u003cp class=\"muted\">Planes creados desde las pestañas Vencimientos (por lote) y Venta lenta (por producto). $ involucrado = valor del lote (vencimiento) o del stock del producto (venta lenta) en los planes no terminados. Atrasados = fecha límite vencida sin terminar.\u003c/p>\n      \u003cdiv class=\"tbox\">\n        \u003ctable class=\"sv-table pl-table\">\n          \u003cthead>\u003ctr>\u003cth class=\"l\">Tipo\u003c/th>\u003cth>Planes\u003c/th>\u003cth>Pendiente\u003c/th>\u003cth>En curso\u003c/th>\u003cth>Hecho\u003c/th>\u003cth>Descartado\u003c/th>\u003cth>Atrasados\u003c/th>\u003cth>$ involucrado\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody data-draw=\"plResumen\" data-source=\"sku lotes\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n      \u003cp class=\"muted\">\u003cspan data-draw=\"plCober\" data-t=\"venc\" data-source=\"sku lotes\">—\u003c/span> · \u003cspan data-draw=\"plCober\" data-t=\"vl\" data-source=\"sku lotes\">—\u003c/span>\u003c/p>\n    \u003c/div>\n\n    \u003cdiv class=\"card\" id=\"pl-list-card\">\n      \u003ch2>Planes creados\u003c/h2>\n      \u003cp class=\"muted\">Todos los planes cargados desde Vencimientos y Venta lenta, del más reciente al más antiguo. El estado se puede cambiar acá mismo; \"Editar\" abre el plan completo.\u003c/p>\n      \u003cdiv class=\"tbox\">\n        \u003ctable class=\"sv-table pl-table\">\n          \u003cthead>\u003ctr>\u003cth class=\"l\">Producto\u003c/th>\u003cth class=\"l\">Tipo\u003c/th>\u003cth class=\"l\">Lote / motivo\u003c/th>\u003cth>Cantidad\u003c/th>\u003cth>Valor\u003c/th>\u003cth class=\"l\">Acción\u003c/th>\u003cth class=\"l\">Detalle\u003c/th>\u003cth class=\"l\">Responsable\u003c/th>\u003cth class=\"l\">Fecha límite\u003c/th>\u003cth class=\"l\">Estado\u003c/th>\u003cth class=\"l\">\u003c/th>\u003c/tr>\u003c/thead>\n          \u003ctbody data-draw=\"planes\" data-source=\"sku lotes\">\u003c/tbody>\n        \u003c/table>\n      \u003c/div>\n    \u003c/div>\n\n  \u003c/section>\n\n  \u003cdialog class=\"pl-dlg\" id=\"nd-dlg\" aria-label=\"Marcar sin disponibilidad\">\n    \u003cdiv class=\"card\">\n      \u003cdiv class=\"pl-dlg-h\">\u003ch2>Marcar sin disponibilidad\u003c/h2>\u003cbutton class=\"pl-btn nd-close\" type=\"button\" aria-label=\"Cerrar\">Cerrar ×\u003c/button>\u003c/div>\n      \u003cp class=\"nd-prod\">\u003c/p>\n      \u003cp class=\"muted\">El producto deja de contar como \"sin venta\" o \"venta lenta\" (recuadros, listados y consolidado de planes) hasta que quites la marca. Usalo cuando el stock figura en el sistema pero no estuvo disponible para vender. Lo ves con el filtro Motivo = Marcados sin disponibilidad.\u003c/p>\n      \u003cdiv class=\"pl-form\">\n        \u003clabel>Motivo \u003cselect class=\"nd-mot\" aria-label=\"Motivo\">\u003coption>Quiebre de stock\u003c/option>\u003coption>Ingreso reciente\u003c/option>\u003coption>Devolución de cliente\u003c/option>\u003coption>Stock no disponible (reservado o en revisión)\u003c/option>\u003coption>Otro\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel class=\"pl-wide\">Nota \u003cinput class=\"nd-nota\" type=\"text\" maxlength=\"200\" aria-label=\"Nota\">\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"ctrls\">\u003cbutton class=\"pl-btn pl-add nd-save\" type=\"button\">Guardar marca\u003c/button>\u003cspan class=\"muted nd-msg\">\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/dialog>\n  \u003cdialog class=\"pl-dlg\" id=\"pl-dlg\" aria-label=\"Plan de acción\">\n    \u003cdiv class=\"card\" id=\"pl-form-card\">\n      \u003cdiv class=\"pl-dlg-h\">\u003ch2 class=\"pl-dlg-t\">Plan de acción\u003c/h2>\u003cbutton class=\"pl-btn pl-close\" type=\"button\" aria-label=\"Cerrar\">Cerrar ×\u003c/button>\u003c/div>\n      \u003cdiv class=\"pl-form\">\n        \u003clabel class=\"pl-wide\">Producto \u003cinput class=\"pl-in\" data-k=\"producto\" type=\"text\" readonly placeholder=\"Producto, código unificado o SKU\" aria-label=\"Producto\">\u003c/label>\n        \u003clabel>Tipo de plan \u003cselect class=\"pl-in\" data-k=\"tipo\" aria-label=\"Tipo de plan\">\u003coption>Vencimiento\u003c/option>\u003coption>Venta lenta\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Acción \u003cselect class=\"pl-in\" data-k=\"accion\" aria-label=\"Acción\">\u003coption>Promoción / descuento\u003c/option>\u003coption>Transferir a otro canal\u003c/option>\u003coption>Negociar devolución con proveedor\u003c/option>\u003coption>Suspender compras\u003c/option>\u003coption>Ajustar pedido de compra\u003c/option>\u003coption>Liquidar / venta especial\u003c/option>\u003coption>Revisar vencimiento\u003c/option>\u003coption>Otra\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Responsable \u003cinput class=\"pl-in\" data-k=\"responsable\" type=\"text\" maxlength=\"80\" aria-label=\"Responsable\">\u003c/label>\n        \u003clabel>Fecha límite \u003cinput class=\"pl-in\" data-k=\"fecha\" type=\"date\" min=\"2026-01-01\" max=\"2099-12-31\" aria-label=\"Fecha límite\">\u003c/label>\n        \u003clabel>Estado \u003cselect class=\"pl-in\" data-k=\"estado\" aria-label=\"Estado\">\u003coption>Pendiente\u003c/option>\u003coption>En curso\u003c/option>\u003coption>Hecho\u003c/option>\u003coption>Descartado\u003c/option>\u003c/select>\u003c/label>\n        \u003clabel>Motivo (venta lenta) \u003cinput class=\"pl-in\" data-k=\"motivo\" type=\"text\" readonly placeholder=\"Se completa desde la pestaña Venta lenta\" aria-label=\"Motivo\">\u003c/label>\n        \u003clabel class=\"pl-wide\">Lote (planes por vencimiento) \u003cinput class=\"pl-in\" data-k=\"lote_txt\" type=\"text\" readonly placeholder=\"Se completa al crear el plan desde la pestaña Vencimientos\" aria-label=\"Lote\">\u003c/label>\n        \u003clabel class=\"pl-wide\">Detalle \u003ctextarea class=\"pl-in\" data-k=\"detalle\" rows=\"2\" maxlength=\"600\" aria-label=\"Detalle del plan\">\u003c/textarea>\u003c/label>\n      \u003c/div>\n      \u003cdiv class=\"ctrls\">\u003cbutton class=\"pl-btn pl-add\" type=\"button\">Agregar plan\u003c/button>\u003cbutton class=\"pl-btn pl-add pl-save\" type=\"button\" hidden>Guardar cambios\u003c/button>\u003cbutton class=\"pl-btn pl-del\" type=\"button\" hidden>Borrar plan\u003c/button>\n        \u003cspan class=\"pl-fm muted\" data-fm=\"pick\" hidden>Elegí un producto de la lista.\u003c/span>\u003cspan class=\"pl-fm muted\" data-fm=\"saving\" hidden>Guardando…\u003c/span>\u003cspan class=\"pl-fm muted\" data-fm=\"saved\" hidden>Guardado.\u003c/span>\u003cspan class=\"pl-fm bad\" data-fm=\"perm\" hidden>No tenés permiso para editar los planes.\u003c/span>\u003cspan class=\"pl-fm bad\" data-fm=\"err\" hidden>No se pudo guardar. Probá de nuevo.\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/dialog>\n\u003c/div>\n\n\n\u003c/div>\n\u003cscript id=\"sv-params\" type=\"application/json\">{\"abc\": \"Todos\", \"dim\": \"division\", \"div\": null, \"estado\": \"Todos\", \"exc\": \"riesgo\", \"lv_plan\": \"todos\", \"metric\": \"imp\", \"periodo\": \"3m\", \"pl_lot\": \"todos\", \"pl_mot\": \"todos\", \"prod\": null, \"pv_sin\": \"todos\", \"rango\": \"Todos\", \"riesgo\": \"todos\", \"sd_abc\": \"Todos\", \"sd_div\": null, \"sd_sit\": \"Todas\", \"sd_un\": null, \"unidad\": \"b\", \"unif\": \"Todos\", \"ventana\": \"sv_3m\", \"vista\": \"mix_canal\", \"vl_cat\": \"Todos\", \"vl_plan\": \"todos\", \"marca\": null, \"cal\": null}\u003c/script>\n\u003cscript>\n(() => {\n  // ---- runtime mínimo del tablero (reemplaza al de Claude) ----\n  let DATA = null;\n  let params = JSON.parse(document.getElementById('sv-params').textContent);\n  try { const s = JSON.parse(localStorage.getItem('sv_params') || 'null'); if (s) params = Object.assign(params, s); } catch (e) {}\n  const draws = new Map(), calcs = new Map(), onData = []; let cache = new Map(), pending = false;\n  const root = () => document.getElementById('dash-root');\n  const getData = (id) => {\n    if (!DATA) return {status: 'loading', data: null};\n    if (DATA[id]) return {status: 'ok', data: DATA[id]};\n    const c = calcs.get(id); if (!c) return {status: 'missing', data: null};\n    if (!cache.has(id)) {\n      const ins = c.inputs.map((n) => getData(n));\n      if (ins.some((x) => x.status !== 'ok')) return {status: 'loading', data: null};\n      try { cache.set(id, {status: 'ok', data: c.fn(...ins.map((x) => x.data))}); } catch (e) { console.error('calc', id, e); cache.set(id, {status: 'error', data: null}); }\n    }\n    return cache.get(id);\n  };\n  const runDraw = (name) => { const fn = draws.get(name); if (!fn || !DATA) return; for (const el of root().querySelectorAll('[data-draw=\"' + name + '\"]')) { try { fn(el); } catch (e) { console.error('draw', name, e); } } };\n  const renderAll = () => { pending = false; if (!DATA) return; for (const n of draws.keys()) runDraw(n); for (const f of onData) { try { f(); } catch (e) { console.error(e); } } };\n  const schedule = () => { if (!pending) { pending = true; requestAnimationFrame(renderAll); } };\n  window.dash = {\n    calc: (id, def) => { calcs.set(id, def); cache.delete(id); schedule(); },\n    draw: (name, fn) => { if (fn) { draws.set(name, fn); schedule(); } else runDraw(name); },\n    data: getData,\n    params: () => Object.assign({}, params),\n    setParams: (o) => { params = Object.assign({}, params, o); cache = new Map(); try { localStorage.setItem('sv_params', JSON.stringify(params)); } catch (e) {} schedule(); },\n    onData: (f) => { onData.push(f); schedule(); },\n    setLink: (id) => { schedule(); },\n  };\n  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderAll, 150); });\n  const msg = (txt, bad) => { const el = document.getElementById('sv-loading'); if (!el) return; el.hidden = !txt; el.textContent = txt || ''; el.classList.toggle('bad', !!bad); };\n  // ---- conexión con la planilla: API de Apps Script (link /exec) + token del link ----\n  const API = window.__ZUPPA_API, TOKEN = window.__ZUPPA_T;\n  const api = (body) => fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({t: TOKEN}, body))})\n    .then((r) => r.json()).then((j) => { if (!j.ok) throw new Error(j.error || 'Error'); return j; });\n  const srv = {\n    datos: () => Promise.resolve(window.__ZUPPA_PRELOAD),\n    listar: (name) => api({accion: 'listar', name}).then((j) => j.rows),\n    guardar: (name, id, json, merge) => api({accion: 'guardar', name, id, data: json, merge}).then((j) => j.rows),\n    borrar: (name, id) => api({accion: 'borrar', name, id}).then((j) => j.rows),\n  };\n  srv.datos().then((d) => { DATA = d; msg(''); cache = new Map(); renderAll(); });\n\n  // ---- registro de planes y marcas en la planilla (pestañas Planes y Disponibilidad) ----\n  const COL = {};\n  const col = (name) => COL[name] || (COL[name] = {rows: [], subs: [], loaded: false});\n  const emit = (name) => { const c = col(name); const snap = {docs: [...c.rows].sort((a, b) => String(b.creado || '').localeCompare(String(a.creado || ''))).map((p) => ({id: p.id, data: () => { const {id, ...r} = p; return r; }}))}; for (const f of c.subs) { try { f(snap); } catch (e) { console.error(e); } } };\n  const load = (name) => srv.listar(name).then((rows) => { col(name).rows = rows || []; col(name).loaded = true; emit(name); });\n  const db = {\n    collection: (name) => { const q = {orderBy: () => q, limit: () => q, onSnapshot: (cb, err) => { col(name).subs.push(cb); load(name).catch((e) => err && err(e)); return () => {}; }}; return q; },\n    doc: (path) => { const [name, id] = path.split('/'); const after = (rows) => { col(name).rows = rows || []; emit(name); };\n      return {\n        set: (d) => srv.guardar(name, id, JSON.stringify(d), false).then(after),\n        update: (d) => srv.guardar(name, id, JSON.stringify(d), true).then(after),\n        delete: () => srv.borrar(name, id).then(after),\n      }; },\n  };\n  window.claude = {use: async (n) => (n === 'db' ? db : null)};\n  setInterval(() => { for (const n of Object.keys(COL)) load(n).catch(() => {}); }, 120000);\n})();\n\u003c/script>\n\u003cscript>\n// ---------- cálculos ----------\nwindow.SVF = {};\nconst svCalc = (id, def) => { SVF[id] = def; dash.calc(id, def); };\nsvCalc('kpi', {inputs: ['sku'], title: 'Totales generales', description: 'Sumas sobre todos los SKU: venta, stock, inmovilizado, vencido y comprados sin venta.', fn: (sku) => {\n  const s = (f, p) => sku.filter(p || (() => true)).reduce((a, r) => a + (+r[f] || 0), 0);\n  const inm = (r) => r.estado === 'Inmovilizado' || r.estado === 'Lento (>180 d)';\n  return [{venta_3m_b: s('v_3m'), venta_3m_b_p: s('v_3m_p'), venta_oct_b_p: s('v_oct_p'), stock_b_p: s('stock_b_p'), inmov_b_p: s('stock_b_p', inm), venc_b_p: s('b_vencido_p'), venta_3m_imp: s('imp_3m'), venta_oct_b: s('v_oct'), skus_venta: sku.filter((r) => r.v_3m > 0).length,\n    stock_b: s('stock_b'), stock_imp: s('stock_imp'), inmov_b: s('stock_b', inm), inmov_imp: s('stock_imp', inm),\n    inmov_share: s('stock_imp', inm) / s('stock_imp'), venc_b: s('b_vencido'), venc_imp: s('imp_vencido'), v60_imp: s('imp_vence60'),}];\n}});\nsvCalc('abc_res', {inputs: ['sku'], title: 'Resumen por clase ABC', description: 'SKUs, venta, compras, stock y cobertura por clase ABC.', fn: (sku) => {\n  const tot = sku.reduce((a, r) => a + (+r.v_3m || 0), 0);\n  return ['A', 'B', 'C', 'Sin venta'].map((c) => {\n    const g = sku.filter((r) => r.abc === c);\n    const s = (f) => g.reduce((a, r) => a + (+r[f] || 0), 0);\n    const vd = (s('v_3m') + s('v_oct')) / %%DIAS%%;\n    return {abc: c, skus: g.length, venta_b: s('v_3m'), venta_b_p: s('v_3m_p'), comp_b_p: s('comp_b_p'), stock_b_p: s('stock_b_p'), share: tot ? s('v_3m') / tot : 0, venta_imp: s('imp_3m'), comp_b: s('comp_b'), stock_b: s('stock_b'), stock_imp: s('stock_imp'), cob_dias: vd > 0 ? s('stock_b') / vd : null};\n  });\n}});\nsvCalc('exc_res', {inputs: ['sku'], title: 'Compras por encima de la venta', description: 'Exceso de compra %%R3%% sobre la venta del mismo período, separado entre productos con stock en riesgo (sobrestock, lento o inmovilizado) y con rotación sana.', fn: (sku) => {\n  const g = {riesgo: sku.filter((r) => r.exceso_b > 0 && r.exc_riesgo === true), sano: sku.filter((r) => r.exceso_b > 0 && r.exc_riesgo !== true), total: sku.filter((r) => r.exceso_b > 0)};\n  return ['riesgo', 'sano', 'total'].map((k) => ({grupo: k, skus: g[k].length, exceso_b: g[k].reduce((a, r) => a + r.exceso_b, 0), exceso_b_p: g[k].reduce((a, r) => a + r.exceso_b_p, 0), exceso_imp: g[k].reduce((a, r) => a + r.exceso_imp, 0)}));\n}});\nsvCalc('exc_tot', {inputs: ['sku'], title: 'Compras y venta %%R3%%', description: 'Totales de compras y venta %%R3%% y su relación.', fn: (sku) => {\n  const s = (f) => sku.reduce((a, r) => a + (+r[f] || 0), 0);\n  return [{compras_b: s('comp_b'), compras_b_p: s('comp_b_p'), compras_imp: s('comp_imp'), venta_b: s('v_3m'), venta_b_p: s('v_3m_p'), venta_imp: s('imp_3m'), ratio: s('v_3m') ? s('comp_b') / s('v_3m') : null}];\n}});\nsvCalc('stock_disp', {inputs: ['sku'], title: 'Stock disponible por clase y unidad de negocio', description: 'Productos con stock (al menos 1 bulto), bultos, pallets y valor del stock actual, en total, por clase ABC y por unidad de negocio; incluye los productos sin venta desde el %%REC%% y los de venta lenta (cobertura mayor a 180 días, con venta desde el %%REC%%), con su stock y valor.', fn: (sku) => {\n  const st = sku.filter((r) => r.stock_b > 0);\n  const tot = st.reduce((a, r) => a + r.stock_imp, 0);\n  const sv = (r) => r.situacion === '%%SV_LBL%%';\n  const le = (r) => r.estado === 'Lento (>180 d)' && !sv(r) && !r.nodisp;\n  const vo = (g) => ({vo_b: g.reduce((a, r) => a + (r.v_oct || 0), 0), vo_p: g.reduce((a, r) => a + (r.v_oct_p || 0), 0), vo_imp: g.reduce((a, r) => a + (r.imp_oct || 0), 0)});\n  const row = (tipo, grupo, g, all) => ({...vo(all), tipo, grupo, skus: g.length, bultos: g.reduce((a, r) => a + r.stock_b, 0), pallets: g.reduce((a, r) => a + r.stock_b_p, 0), valor: g.reduce((a, r) => a + r.stock_imp, 0), share: tot ? g.reduce((a, r) => a + r.stock_imp, 0) / tot : 0,\n    sv_skus: g.filter(sv).length, sv_valor: g.filter(sv).reduce((a, r) => a + r.stock_imp, 0),\n    le_skus: g.filter(le).length, le_valor: g.filter(le).reduce((a, r) => a + r.stock_imp, 0)});\n  const out = [row('total', 'Total', st, sku)];\n  for (const c of ['A', 'B', 'C', 'Sin venta']) out.push(row('abc', c, st.filter((r) => r.abc === c), sku.filter((r) => r.abc === c)));\n  const uns = [...new Set(st.map((r) => r.unidad_negocio).concat(sku.filter((r) => (r.v_oct || 0) > 0).map((r) => r.unidad_negocio)))];\n  const urows = uns.map((u) => row('un', u, st.filter((r) => r.unidad_negocio === u), sku.filter((r) => r.unidad_negocio === u))).sort((a, b) => b.valor - a.valor);\n  return out.concat(urows);\n}});\nsvCalc('sku_lotes', {inputs: ['sku', 'lotes'], title: 'Productos por lote de vencimiento', description: 'Una fila por lote de vencimiento (y SKU original) con los datos de su producto unificado: stock total, venta, cobertura, estado y última compra.', fn: (sku, lotes) => {\n  const byK = new Map(sku.map((r) => [String(r.k), r]));\n  return lotes.filter((l) => byK.has(String(l.k))).map((l) => ({...byK.get(String(l.k)), lote: l.lote, sku_origen: l.sku_origen, vto: l.vto, dias: l.dias, lote_b: l.bultos, lote_b_p: l.bultos_p, lote_valor: l.valor, lote_riesgo_b: l.bultos_riesgo, lote_riesgo_b_p: l.bultos_riesgo_p, lote_valor_riesgo: l.valor_riesgo, situacion: byK.get(String(l.k)).situacion || (byK.get(String(l.k)).stock_b > 0 ? 'Venta normal' : null)}));\n}});\nsvCalc('vl_res', {inputs: ['sku'], title: 'Productos de venta lenta por motivo', description: 'Productos con stock sin venta desde el %%REC%%, con más de 180 días de cobertura (o inmovilizados) y con sobrestock de 90 a 180 días: cantidad, bultos, pallets y valor.', fn: (sku) => {\n  const cat = (r) => (r.stock_b \u003c= 0 || r.nodisp ? null : r.situacion === '%%SV_LBL%%' ? '%%SV_LBL%%' : r.estado === 'Lento (>180 d)' || r.estado === 'Inmovilizado' ? 'Venta lenta (> 180 días)' : r.estado === 'Sobrestock (90-180 d)' ? 'Sobrestock (90 a 180 días)' : null);\n  const row = (c, g) => ({cat: c, productos: g.length, bultos: g.reduce((a, r) => a + r.stock_b, 0), bultos_p: g.reduce((a, r) => a + r.stock_b_p, 0), valor: g.reduce((a, r) => a + r.stock_imp, 0)});\n  const all = sku.filter((r) => cat(r));\n  return ['%%SV_LBL%%', 'Venta lenta (> 180 días)', 'Sobrestock (90 a 180 días)'].map((c) => row(c, all.filter((r) => cat(r) === c))).concat([row('Total', all)]);\n}});\nsvCalc('estado_res', {inputs: ['sku'], title: 'Stock por estado', description: 'Bultos, valor y SKUs de stock según su estado de rotación.', fn: (sku) =>\n  ['Inmovilizado', 'Lento (>180 d)', 'Sobrestock (90-180 d)', 'Sano'].map((e) => {\n    const g = sku.filter((r) => r.estado === e);\n    return {estado: e, skus: g.length, stock_b: g.reduce((a, r) => a + r.stock_b, 0), stock_b_p: g.reduce((a, r) => a + r.stock_b_p, 0), stock_imp: g.reduce((a, r) => a + r.stock_imp, 0)};\n  })\n});\nsvCalc('inmov_dim', {inputs: ['sku'], title: 'Stock en riesgo por categoría', description: 'Stock inmovilizado, lento y sobrestock agrupado por división, unidad de negocio, calibre y marca.', fn: (sku) => {\n  const out = [];\n  for (const dim of ['division', 'unidad_negocio', 'calibre', 'marca']) {\n    const m = new Map();\n    for (const r of sku) {\n      const k = r[dim] || 'S/D';\n      if (!m.has(k)) m.set(k, {dim, grupo: k, inm_b: 0, inm_imp: 0, inm_p: 0, len_b: 0, len_imp: 0, len_p: 0, sob_b: 0, sob_imp: 0, sob_p: 0, stock_b: 0, stock_imp: 0, stock_p: 0});\n      const o = m.get(k);\n      o.stock_b += r.stock_b; o.stock_imp += r.stock_imp; o.stock_p += r.stock_b_p;\n      const t = r.estado === 'Inmovilizado' ? 'inm' : r.estado === 'Lento (>180 d)' ? 'len' : r.estado === 'Sobrestock (90-180 d)' ? 'sob' : null;\n      if (t) { o[t + '_b'] += r.stock_b; o[t + '_imp'] += r.stock_imp; o[t + '_p'] += r.stock_b_p; }\n    }\n    out.push(...m.values());\n  }\n  return out;\n}});\ndash.calc('cvv', {inputs: ['compras_mes', 'sku', 'canal'], title: 'Compras vs. ventas por mes', description: 'Por mes (%%R4%%), clase ABC y total: bultos y pallets comprados y vendidos; compras en $ (facturas), ventas valorizadas al costo del mes (bultos vendidos × precio promedio de compra del producto en ese mes) y ventas a importe neto.', fn: (compras_mes, sku, cana
